name: Windows C++ validation
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-msvc-debug, windows-msvc-release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 4 --config ${{ matrix.preset == 'windows-msvc-debug' && 'Debug' || 'Release' }}
      - name: Test
        run: ./scripts/ci-test.ps1 -Preset '${{ matrix.preset }}'
      - name: Stage Release runtime (headset and game tests NOT_RUN)
        if: matrix.preset == 'windows-msvc-release'
        run: |
          cmake --install out/build/release --config Release --component Runtime --prefix out/package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = @{schema_version=1; source_commit=(git rev-parse HEAD); source_dirty=[bool](git status --porcelain); configuration='Release'; architecture='x64'; headset_validation='NOT_RUN'; game_validation='NOT_RUN'}
          [IO.File]::WriteAllText((Join-Path $PWD 'out/package/build-info.json'), ($metadata | ConvertTo-Json), [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        if: matrix.preset == 'windows-msvc-release'
        with:
          name: OpenDesertVR-M0-win64
          path: out/package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.preset }}
          path: |
            out/build/*/Testing/Temporary/LastTest.log
            out/build/*/mock-*/report.json
            out/build/*/mock-*/audit.json
            out/build/*/collector-*/run-summary.json
            out/ci-*.log
